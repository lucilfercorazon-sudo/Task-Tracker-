<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="50%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#6366F1" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#30363D" stroke-width="8"/>
  
  <!-- Grid lines subtle pattern -->
  <path d="M128 160 H384 M128 256 H384 M128 352 H384" stroke="#30363D" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <path d="M192 120 V392 M288 120 V392" stroke="#30363D" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Target Habit Check Icon Center -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="#161B22" stroke="url(#accent-grad)" stroke-width="12"/>
    
    <!-- Big Checkmark -->
    <path d="M196 260 L236 300 L324 204" fill="none" stroke="url(#glow-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Sparkles -->
  <path d="M380 130 Q380 150 400 150 Q380 150 380 170 Q380 150 360 150 Q380 150 380 130 Z" fill="#38BDF8"/>
  <path d="M140 370 Q140 385 155 385 Q140 385 140 400 Q140 385 125 385 Q140 385 140 370 Z" fill="#818CF8"/>
  <circle cx="360" cy="360" r="8" fill="#34D399"/>
</svg>
